name: Unity Structure

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-unity-structure:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Validate Unity project structure
        run: python scripts/validate_unity_structure.py
